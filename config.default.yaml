# =============================================================================
# CAU HINH MAC DINH DONG GOI VAO BO CAI (build_server_exe.bat -> dist/config.yaml)
# KHONG chua tai khoan / mat khau. Cau hinh rieng cua may dev nam o config.yaml.
# =============================================================================
filename_pattern:
  date_format: '%Y%m%d'
  regex: ^(?P<patient_id>[A-Za-z0-9]+)_(?P<patient_name>[^_]+)_(?P<study_date>\d{8})
logging:
  level: INFO
  log_folder: ./logs
  retention_days: 90
metadata:
  default_value: UNKNOWN
  institution_name: My Clinic
  modality: OT
  specific_character_set: ISO_IR 192
pacs:
  called_ae_title: PACSTTSG
  calling_ae_title: DICOM_GATEWAY
  connect_timeout_sec: 10
  ip: 192.168.6.213
  port: 6002
  # Storage Commitment (N-ACTION/N-EVENT-REPORT): một số PACS chỉ thực sự
  # index/hiển thị study sau khi nhận xác nhận này, không chỉ dựa vào C-STORE
  # thành công (xem GE MUSE DICOM Gateway Pro làm tương tự với port 105).
  # CHỈ bật khi đã: (1) mở Inbound Firewall cho listen_port, và (2) nhờ PACS
  # admin đăng ký AE Title/IP/port này làm địa chỉ callback Storage Commitment
  # cho calling_ae_title ở trên — nếu không PACS sẽ không biết gửi phản hồi về đâu.
  storage_commitment:
    enabled: true
    listen_port: 105
    listen_ae_title: DICOM_GATEWAY
paths:
  dicom_staging_folder: ./data/dicom_staging
  duplicates_folder: ./data/duplicates
  failed_folder: ./data/failed
  processed_folder: ./data/processed
  registry_db: ./data/registry.sqlite3
  retry_queue_folder: ./data/queue/retry
retry:
  backoff_schedule_sec:
  - 300
  - 900
  - 3600
  - 7200
  - 21600
  max_attempts: 10
  scan_interval_sec: 300
ris:
  called_ae_title: RISTTSG
  calling_ae_title: DICOM_GATEWAY
  connect_timeout_sec: 10
  enabled: true
  ip: 192.168.6.211
  port: 6002
watcher:
  stability_check_count: 3
  stability_check_interval_sec: 2
  watch_folders:
  - modality: US
    path: ./data/inbox
web_ui:
  enabled: true
  host: 0.0.0.0
  port: 5000

auth:
  enabled: true
  session_lifetime_days: 30
  # secret_key: để trống -> mỗi máy tự sinh khóa ngẫu nhiên lưu tại .secret_key (KHÔNG đặt giá trị cố định ở đây)
  # Để TRỐNG trong bản phát hành: lần chạy đầu hệ thống tự tạo tài khoản 'admin'
  # với mật khẩu ngẫu nhiên, lưu tại data/initial_admin_password.txt
  users: []

stations:
  - id: "US_01"
    name: "Phòng Siêu âm 01 (Tổng quát)"
    department: "Khoa Chẩn đoán hình ảnh"
    allowed_modalities: ["US"]
    default_modality: "US"
    icon: "🩺"

  - id: "US_02"
    name: "Phòng Siêu âm 02 (Tim mạch & Mạch máu)"
    department: "Khoa Chẩn đoán hình ảnh"
    allowed_modalities: ["US"]
    default_modality: "US"
    icon: "❤️"

  - id: "ES_01"
    name: "Phòng Nội soi Tiêu hóa"
    department: "Khoa Thăm dò chức năng"
    allowed_modalities: ["ES"]
    default_modality: "ES"
    icon: "🔬"

  - id: "ECG_EEG"
    name: "Phòng Điện tâm đồ & Thần kinh (ECG/EEG/EMG)"
    department: "Khoa Thăm dò chức năng"
    allowed_modalities: ["ECG", "EEG", "EMG"]
    default_modality: "ECG"
    icon: "⚡"

  - id: "BD_01"
    name: "Phòng Đo loãng xương (DEXA)"
    department: "Khoa Chẩn đoán hình ảnh"
    allowed_modalities: ["BD"]
    default_modality: "BD"
    icon: "🦴"

  - id: "PFT_01"
    name: "Phòng Đo chức năng hô hấp"
    department: "Khoa Thăm dò chức năng"
    allowed_modalities: ["PFT", "DOC"]
    default_modality: "PFT"
    icon: "💨"

  - id: "XRAY_01"
    name: "Phòng X-quang Kỹ thuật số (DR/CR)"
    department: "Khoa Chẩn đoán hình ảnh"
    allowed_modalities: ["DR", "CR"]
    default_modality: "DR"
    icon: "📷"

